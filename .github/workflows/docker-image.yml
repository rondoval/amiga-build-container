name: Build image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with upstream tags: https://hub.docker.com/r/stefanreinauer/amiga-gcc/tags
        gcc_version: [gcc-v6.5.0b, gcc-v13.4, gcc-v15.2, gcc-v16.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amiga-build-container
          tags: |
            type=raw,value=${{ matrix.gcc_version }}
            type=raw,value=latest,enable=${{ matrix.gcc_version == 'gcc-v6.5.0b' }}
            type=sha,suffix=-${{ matrix.gcc_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_TAG=${{ matrix.gcc_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
