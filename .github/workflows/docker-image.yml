# Build the toolchain image from the pinned sources in toolchain.lock.json, gate it by building the
# consumer stacks with it, then promote it to the gcc-v16.2 / latest tags.
#
#   build    the `test` target (runs tests/smoke-test.sh inside the image), then pushes the
#            `final` target as ghcr.io/<owner>/amiga-build-container:sha-<git7> (the candidate).
#            The toolchain stage is restored from the registry build cache unless
#            toolchain.lock.json or scripts/ changed (then it is rebuilt: ~35 min on a hosted runner).
#   smoke    builds emu68-driver-stack and poseidon-backport with the candidate, through their
#            own scripts/docker-build.sh (poseidon's also runs its MUI 3.8 subset check).
#   promote  re-tags the candidate as gcc-v16.2 and latest (manifest copy, no blob upload).
#
# Pull requests only run the build (no push, no smoke, no promote). Old gcc-v* tags are never
# touched; they remain as a rollback path.
name: Build image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'toolchain.lock.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'toolchain.lock.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:
    inputs:
      promote:
        description: promote the candidate to gcc-v16.2 + latest after the smoke gate
        type: boolean
        default: true

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/amiga-build-container
  # gcc version tag the promoted candidate gets; keep in sync with the gcc row of toolchain.lock.json
  GCC_TAG: gcc-v16.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      candidate: ${{ steps.tags.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Candidate tag
        id: tags
        run: echo "candidate=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The in-image smoke test (tests/smoke-test.sh) gates before anything is pushed.
      - name: Build and test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Push candidate
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.tags.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.GCC_TAG }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          # mode=max is what caches the toolchain stage; only changed blobs are uploaded
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: emu68-driver-stack
            repo: rondoval/emu68-driver-stack
            image_var: EMU68_BUILD_IMAGE
            args_var: EMU68_CONFIGURE_ARGS
            args: ""
          - name: poseidon-backport 68020/soft
            repo: rondoval/poseidon-backport
            image_var: POSEIDON_BUILD_IMAGE
            args_var: POSEIDON_CONFIGURE_ARGS
            args: "-DM68K_CPU=68020 -DM68K_FPU=soft"
          - name: poseidon-backport 68060/hard
            repo: rondoval/poseidon-backport
            image_var: POSEIDON_BUILD_IMAGE
            args_var: POSEIDON_CONFIGURE_ARGS
            args: "-DM68K_CPU=68060 -DM68K_FPU=hard"
    name: smoke (${{ matrix.name }})
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          submodules: recursive

      # The wrappers own the docker invocation; only the image is overridden. poseidon's also
      # runs its post-build MUI 3.8 subset check (check-mui38.py).
      - name: Build with the candidate image
        env:
          CANDIDATE: ${{ needs.build.outputs.candidate }}
        run: |
          export ${{ matrix.image_var }}="$CANDIDATE"
          export ${{ matrix.args_var }}="${{ matrix.args }}"
          ./scripts/docker-build.sh

  promote:
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.promote)
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag ${{ env.GCC_TAG }} and latest
        env:
          CANDIDATE: ${{ needs.build.outputs.candidate }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${GCC_TAG}" \
            -t "${IMAGE}:latest" \
            "$CANDIDATE"
          docker buildx imagetools inspect "${IMAGE}:${GCC_TAG}" --format '{{ .Manifest.Digest }}'
